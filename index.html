<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METRAJES_404</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=VT323&display=swap" rel="stylesheet" />

    <style>
      :root{
        --bg: #04090d;
        --bg-2: #0a1016;
        --panel: #0a0f14;
        --panel-2: rgba(19, 25, 31, 0.88);
        --border: rgba(255,255,255,0.15);
        --text: #edf3f6;
        --muted: #c9d1d5;
        --blue: #4f8fe8;
        --blue-2: #3d7ed6;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Special Elite", "Courier New", monospace;
      }

      body {
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.015),
            rgba(255,255,255,0.015) 1px,
            transparent 1px,
            transparent 3px
          ),
          linear-gradient(to bottom, rgba(255,255,255,0.02), transparent 18%),
          #04090d;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        background: #050b10;
        position: relative;
      }

      .page::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 20%, rgba(255,255,255,0.025), transparent 28%),
          radial-gradient(circle at 80% 10%, rgba(255,255,255,0.02), transparent 22%);
        mix-blend-mode: screen;
      }

      .topbar {
        height: 90px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 18px 0 20px;
        gap: 18px;
        background: rgba(0,0,0,0.12);
      }

      .logo {
        flex: 0 0 auto;
        font-family: "Creepster", cursive;
        font-size: clamp(2.5rem, 3.8vw, 5rem);
        letter-spacing: 0.06em;
        line-height: 1;
        color: #f6f7f8;
        text-shadow:
          2px 2px 0 rgba(0,0,0,0.95),
          4px 4px 0 rgba(255,255,255,0.08),
          0 0 16px rgba(255,255,255,0.08);
        transform: skewX(-3deg);
        white-space: nowrap;
      }

      .logo span {
        display: inline-block;
      }

      .search-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .searchbar {
        flex: 1;
        height: 44px;
        max-width: 930px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.02);
        border-radius: 3px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        margin-left: 10px;
      }

      .searchbar input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        font-family: "Special Elite", monospace;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
        color: rgba(255,255,255,0.82);
      }

      .searchbar input::placeholder {
        color: rgba(255,255,255,0.5);
      }

      .search-btn {
        width: 92px;
        height: 44px;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 3px;
        background: rgba(255,255,255,0.04);
        color: #f1f1f1;
        font-size: 0.95rem;
        font-family: "Special Elite", monospace;
        letter-spacing: 0.02em;
        cursor: pointer;
        margin-left: 2px;
        transition: background 0.12s ease;
      }

      .search-btn:hover {
        background: rgba(255,255,255,0.08);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: auto;
        padding-right: 8px;
        white-space: nowrap;
      }

      .nav a {
        font-family: "Special Elite", monospace;
        font-size: 0.95rem;
        color: #4d98ff;
        text-decoration: none;
        letter-spacing: 0.02em;
        text-shadow: 0 0 4px rgba(105,160,255,0.15);
      }

      .content {
        padding: 18px 18px 20px;
      }

      .video-grid {
        width: min(100%, 1760px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 26px;
      }

      .card {
        display: grid;
        grid-template-columns: 272px 1fr;
        min-height: 150px;
        background: rgba(17, 21, 26, 0.72);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 0;
        overflow: hidden;
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,0.02),
          0 0 0 1px rgba(0,0,0,0.4);
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }

      .card:hover {
        transform: translateY(-1px);
        border-color: rgba(255,255,255,0.2);
      }

      .thumb {
        position: relative;
        min-height: 100%;
        background-size: cover;
        background-position: center;
        border-right: 1px solid rgba(255,255,255,0.08);
      }

      .thumb::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.02)),
          linear-gradient(to top, rgba(0,0,0,0.12), transparent);
      }

      .meta {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 14px 18px 12px 18px;
        min-width: 0;
      }

      .title-pill {
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        background: var(--blue);
        color: #eef6ff;
        padding: 10px 18px 9px;
        border-radius: 3px;
        font-family: "Special Elite", monospace;
        font-size: clamp(1.25rem, 1.65vw, 2rem);
        line-height: 1.15;
        letter-spacing: 0.01em;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        text-shadow: 0 0 10px rgba(255,255,255,0.05);
      }

      .source {
        margin-top: 12px;
        color: #f0f0f0;
        font-family: "Special Elite", monospace;
        font-size: clamp(1.1rem, 1.4vw, 1.7rem);
        line-height: 1.35;
        letter-spacing: 0.01em;
      }

      .source .label {
        display: block;
        color: rgba(255,255,255,0.95);
      }

      .source .encounter {
        display: block;
        color: rgba(255,255,255,0.82);
      }

      .source strong {
        font-weight: normal;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 5, 9, 0.84);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }

      .modal.open {
        display: flex;
      }

      .modal-box {
        width: min(72vw, 860px);
        background: #0b1118;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 4px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        overflow: hidden;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
      }

      .modal-title {
        font-family: "Special Elite", monospace;
        font-size: 1.1rem;
        color: #f0f0f0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.01em;
      }

      .close-btn {
        background: transparent;
        color: white;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 2px;
        width: 32px;
        height: 32px;
        font-size: 1.4rem;
        cursor: pointer;
        line-height: 1;
      }

      .video-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .video-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 1100px) {
        .video-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          flex-wrap: wrap;
          height: auto;
          padding-top: 12px;
          padding-bottom: 12px;
        }

        .logo {
          width: 100%;
        }

        .search-wrap {
          width: 100%;
          margin-top: 8px;
        }

        .nav {
          width: 100%;
          justify-content: flex-end;
          margin-left: 0;
        }

        .card {
          grid-template-columns: 220px 1fr;
        }

        .modal-box {
          width: min(90vw, 720px);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo"><span>METRAJES_404</span></div>

        <div class="search-wrap">
          <div class="searchbar">
            <input id="searchInput" type="text" placeholder="Search" aria-label="Search" />
          </div>
          <button class="search-btn">Search</button>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <a href="#">Upload</a>
          <a href="#">Sign in</a>
        </nav>
      </header>

      <main class="content">
        <section id="videoGrid" class="video-grid"></section>
      </main>
    </div>

    <div id="videoModal" class="modal" aria-hidden="true">
      <div class="modal-box">
        <div class="modal-header">
          <div id="modalTitle" class="modal-title">Video</div>
          <button id="closeModal" class="close-btn" aria-label="Close video">×</button>
        </div>
        <div class="video-frame">
          <iframe
            id="playerFrame"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            title="Embedded video"
          ></iframe>
        </div>
      </div>
    </div>

        { title: "Imágenes Inquietantes con Música Inquietante (Unnerving Images with Unnerving music)", url: "https://youtu.be/eYbvNYmDH2E?si=OpTd0fy9-P-F6p2y" },

        { title: "Policía de Arabia Saudita se encuentran a una Bruja Real", url: "https://youtu.be/Hfp-tcfMOdU?si=BOqkmB7cXXNHO6Qf" },
        { title: "la mona bruja en Nicaragua", url: "https://youtu.be/ui1A31-xc44?si=RBesl3x889H647hF" },
        { title: "El Silbón en Colombia", url: "https://youtu.be/a4N40cQeWBc?si=gdCg_NkjsZCDXyWn" }

      const videoGrid = document.getElementById("videoGrid");
      const searchInput = document.getElementById("searchInput");
      const videoModal = document.getElementById("videoModal");
      const modalTitle = document.getElementById("modalTitle");
      const playerFrame = document.getElementById("playerFrame");
      const closeModal = document.getElementById("closeModal");

      function getVideoIdFromUrl(url) {
        try {
          const parsed = new URL(url);

          if (parsed.hostname.includes("youtu.be")) {
            return parsed.pathname.replace("/", "");
          }

          if (parsed.hostname.includes("youtube.com")) {
            const v = parsed.searchParams.get("v");
            if (v) return v;
          }

          return "";
        } catch (err) {
          return "";
        }
      }

      function getEmbedUrl(url) {
        const id = getVideoIdFromUrl(url);
        return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
      }

      function openModal(video) {
        modalTitle.textContent = video.title;
        playerFrame.src = getEmbedUrl(video.url);
        videoModal.classList.add("open");
        videoModal.setAttribute("aria-hidden", "false");
      }

      function closeVideoModal() {
        videoModal.classList.remove("open");
        videoModal.setAttribute("aria-hidden", "true");
        playerFrame.src = "";
      }

      function renderVideos(filter = "") {
        const query = filter.trim().toLowerCase();
        videoGrid.innerHTML = "";

        const filtered = videos.filter((video) =>
          video.title.toLowerCase().includes(query)
        );

        const visible = filtered.slice(0, 4);

        visible.forEach((video) => {
          const card = document.createElement("article");
          card.className = "card";
          const videoId = getVideoIdFromUrl(video.url);

          card.innerHTML = `
            <div class="thumb" style="background-image: url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg');"></div>
            <div class="meta">
              <div class="title-pill">${video.title}</div>
              <div class="source">
                <span class="label">YouTube</span>
                <span class="encounter">Encontrado por: <strong>DonNadie404</strong></span>
              </div>
            </div>
          `;

          card.addEventListener("click", () => openModal(video));
          videoGrid.appendChild(card);
        });
      }

      searchInput.addEventListener("input", (e) => {
        renderVideos(e.target.value);
      });

      closeModal.addEventListener("click", closeVideoModal);

      videoModal.addEventListener("click", (e) => {
        if (e.target === videoModal) closeVideoModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && videoModal.classList.contains("open")) {
          closeVideoModal();
        }
      });

      renderVideos();
    </script>
  </body>
</html>
