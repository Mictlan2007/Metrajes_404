<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Tube</title>
    <style>
      :root {
        --bg: #f1f1f1;
        --panel: #ffffff;
        --ink: #111111;
        --muted: #606060;
        --border: #d9d9d9;
        --youtube-red: #ff0000;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .topbar {
        height: 56px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 18px;
      }

      .menu-icon {
        width: 18px;
        height: 14px;
        position: relative;
      }

      .menu-icon span {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: #333;
        border-radius: 2px;
      }

      .menu-icon span:nth-child(1) { top: 0; }
      .menu-icon span:nth-child(2) { top: 6px; }
      .menu-icon span:nth-child(3) { top: 12px; }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .brand-mark {
        width: 28px;
        height: 20px;
        background: var(--youtube-red);
        border-radius: 6px;
        position: relative;
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        left: 11px;
        top: 6px;
        width: 0;
        height: 0;
        border-left: 8px solid white;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }

      .page {
        max-width: 1180px;
        margin: 18px auto;
        padding: 0 16px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2.3fr) minmax(260px, 0.9fr);
        gap: 20px;
      }

      .video-panel {
        background: #fff;
        border: 1px solid var(--border);
        padding: 10px;
      }

      .video-shell {
        position: relative;
        background: #000;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
      }

      .video-shell iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
      }

      .title-box {
        background: #fff;
        border-top: 1px solid var(--border);
        padding: 14px 8px 0;
      }

      .video-title {
        margin: 0;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.3;
      }

      .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .sidebar {
        background: #fff;
        border: 1px solid var(--border);
        padding: 8px;
      }

      .sidebar-title {
        margin: 8px 8px 12px;
        font-size: 1rem;
        font-weight: 700;
      }

      .video-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .video-item {
        display: grid;
        grid-template-columns: 168px 1fr;
        gap: 10px;
        padding: 6px;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .video-item:hover,
      .video-item.active {
        background: #f8f8f8;
        border-color: var(--border);
      }

      .thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        overflow: hidden;
        background-size: cover;
        background-position: center;
      }

      .thumb::after {
        content: "▶";
        position: absolute;
        right: 8px;
        bottom: 8px;
        color: white;
        background: rgba(0,0,0,0.55);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.75rem;
      }

      .video-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }

      .video-copy h4 {
        margin: 0 0 6px;
        font-size: 0.96rem;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .video-copy span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>

        </section>

        <aside class="sidebar">

      function getVideoIdFromUrl(url) {
        try {
          const parsed = new URL(url);

          if (parsed.hostname.includes("youtu.be")) {
            return parsed.pathname.replace("/", "");
          }

          if (parsed.hostname.includes("youtube.com")) {
            const v = parsed.searchParams.get("v");
            if (v) return v;
          }

          return "";
        } catch (e) {
          return "";
        }
      }

      function getEmbedUrl(url) {
        const videoId = getVideoIdFromUrl(url);
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      }

      const videoList = document.getElementById("videoList");
      const currentTitle = document.getElementById("currentTitle");
      const videoFrame = document.getElementById("videoFrame");
      const metaLabel = document.getElementById("metaLabel");

      function renderPlaylist() {
        videos.forEach((video, index) => {
          const item = document.createElement("div");
          item.className = "video-item" + (index === 0 ? " active" : "");

          const videoId = getVideoIdFromUrl(video.url);

          item.innerHTML = `
            <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg')"></div>
            <div class="video-copy">
              <h4>${video.title}</h4>
              <span>Video</span>
            </div>
          `;

          item.addEventListener("click", () => {
            document.querySelectorAll(".video-item").forEach(el => el.classList.remove("active"));
            item.classList.add("active");
            currentTitle.textContent = video.title;
            videoFrame.src = getEmbedUrl(video.url);
          });

          videoList.appendChild(item);
        });

        metaLabel.textContent = `${videos.length} videos • playlist`;
      }

      function initFirstVideo() {
        const first = videos[0];
        currentTitle.textContent = first.title;
        videoFrame.src = getEmbedUrl(first.url);
      }

      renderPlaylist();
      initFirstVideo();
    </script>
