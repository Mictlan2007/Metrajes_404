<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Tube</title>
    <style>
      :root {
        --bg: #f1f1f1;
        --panel: #ffffff;
        --ink: #111111;
        --muted: #606060;
        --border: #d9d9d9;
        --youtube-red: #ff0000;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .topbar {
        height: 56px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 18px;
      }

      .menu-icon {
        width: 18px;
        height: 14px;
        position: relative;
      }

      .menu-icon span {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: #333;
        border-radius: 2px;
      }

      .menu-icon span:nth-child(1) { top: 0; }
      .menu-icon span:nth-child(2) { top: 6px; }
      .menu-icon span:nth-child(3) { top: 12px; }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .brand-mark {
        width: 28px;
        height: 20px;
        background: var(--youtube-red);
        border-radius: 6px;
        position: relative;
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        left: 11px;
        top: 6px;
        width: 0;
        height: 0;
        border-left: 8px solid white;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }

      .page {
        max-width: 1180px;
        margin: 18px auto;
        padding: 0 16px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2.3fr) minmax(260px, 0.9fr);
        gap: 20px;
      }

      .video-panel {
        background: #fff;
        border: 1px solid var(--border);
        padding: 10px;
      }

      .video-shell {
        position: relative;
        background: #000;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
      }

      .video-shell iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
      }

      .title-box {
        background: #fff;
        border-top: 1px solid var(--border);
        padding: 14px 8px 0;
      }

      .video-title {
        margin: 0;
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.3;
      }

      .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .sidebar {
        background: #fff;
        border: 1px solid var(--border);
        padding: 8px;
      }

      .sidebar-title {
        margin: 8px 8px 12px;
        font-size: 1rem;
        font-weight: 700;
      }

      .video-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .video-item {
        display: grid;
        grid-template-columns: 168px 1fr;
        gap: 10px;
        padding: 6px;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .video-item:hover,
      .video-item.active {
        background: #f8f8f8;
        border-color: var(--border);
      }

      .thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        overflow: hidden;
        background-size: cover;
        background-position: center;
      }

      .thumb::after {
        content: "▶";
        position: absolute;
        right: 8px;
        bottom: 8px;
        color: white;
        background: rgba(0,0,0,0.55);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.75rem;
      }

      .video-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }

      .video-copy h4 {
        margin: 0 0 6px;
        font-size: 0.96rem;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .video-copy span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="menu-icon" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="brand" aria-label="Classic Tube">
        <span class="brand-mark"></span>
        <span>Classic Tube</span>
      </div>
    </header>

    <main class="page">
      <div class="layout">
        <section class="video-panel">
          <div class="video-shell">
            <iframe
              id="videoFrame"
              src=""
              title="Video"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>

          <div class="title-box">
            <h1 id="currentTitle" class="video-title">Loading...</h1>
            <div class="meta">18 videos • playlist</div>
          </div>
        </section>

        <aside class="sidebar">
          <div class="sidebar-title">Up next</div>
          <div id="videoList" class="video-list"></div>
        </aside>
      </div>
    </main>

    <script>
      const videos = [
        { title: "Tengo Miedo!", url: "https://youtu.be/p7zevPed3Ss?si=FB4jr-6bAI_FypnM" },
        { title: "Keyboard Cat! - EL ORIGINAL!", url: "https://youtu.be/J---aiyznGQ?si=7wKKtr93bBLFnoHg" },
        { title: "Mirada Dramática", url: "https://youtu.be/y8Kyi0WNg40?si=16-cXDdtcttkvp7f" },
        { title: "Aparición de un Duende", url: "https://youtu.be/xPghfRHZUFs?si=Lh0jyra4t4DHI80n" },
        { title: "Body Of A Pig", url: "https://youtu.be/X72xDpv898Y?si=URfompjMCPqXnNYF" },
        { title: "“Dining Room” o “There is Nothing”", url: "https://youtu.be/ns1SGo3WCF4?si=gpxBpzMSae3ORL7O" },
        { title: "Experimentos sobre la Reanimación de Organismos", url: "https://youtu.be/KDqh-r8TQgs?si=yjgnS6cUqokESQQQ" },
        { title: "Hombre se pierde en las Catacumbas de París Parte 1 de 2", url: "https://youtu.be/yxJkMlqYrys?si=fiHjDgGhfFq4tdDF" },
        { title: "Max Headroom 1987 Incidente de Intrusión en la Señal de Transmisión", url: "https://youtu.be/oqgeM6rWSkw?si=RyZWanv83laKocdu" },
        { title: "Hombre se pierde en las Catacumbas de París Parte 2 de 2", url: "https://youtu.be/Hi5iKa3DFnM?si=Wf6AZzm9KwX_uPFg" },
        { title: "EXN OFICIAL: LA PASCUALITA DE CHIHUAHUA", url: "https://youtu.be/cUG6MSkIfFY?si=Elgz-DybWD6LPanA" },
        { title: "Fantasma gritando en hotel embrujado - VERSIÓN COMPLETA", url: "https://youtu.be/BobA5ujHkvU?si=QSmSW3y77KCqtEtY" },
        { title: "DEMONIOS REALES CAPTADOS EN CÁMARA", url: "https://youtu.be/oEVfREVGcaY?si=QlM-2LIgXBmG-Kgf" },
        { title: "LUISON EN PARAGUAY", url: "https://youtu.be/L66UNoHyuag?si=uEzpX7TG3-2kDsj6" },
        { title: "My Ghoul Jackson", url: "https://youtu.be/C8pOvjf6G-o?si=mB0o4prXHymM0zL6" },
        { title: "Who's Hungry?", url: "https://youtu.be/8srEvrF90-s?si=T2kr8-pGzKltPK5V" },
        { title: "Comercial Japones", url: "https://youtu.be/oFvtqlny43M?si=1l2EfxhuxhhoaWxD" },
        { title: "Celulares Bailando", url: "https://youtu.be/fOq6Ydi9JEg?si=LYKbb1PnuwbovZRr" }
      ];

      function getVideoIdFromUrl(url) {
        try {
          const parsed = new URL(url);

          if (parsed.hostname.includes("youtu.be")) {
            return parsed.pathname.replace("/", "");
          }

          if (parsed.hostname.includes("youtube.com")) {
            const v = parsed.searchParams.get("v");
            if (v) return v;
          }

          return url;
        } catch (e) {
          return url;
        }
      }

      function getEmbedUrl(url) {
        const videoId = getVideoIdFromUrl(url);
        return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      }

      const videoList = document.getElementById("videoList");
      const currentTitle = document.getElementById("currentTitle");
      const videoFrame = document.getElementById("videoFrame");

      function renderPlaylist() {
        videos.forEach((video, index) => {
          const item = document.createElement("div");
          item.className = "video-item" + (index === 0 ? " active" : "");

          const videoId = getVideoIdFromUrl(video.url);

          item.innerHTML = `
            <div class="thumb" style="background-image:url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg')"></div>
            <div class="video-copy">
              <h4>${video.title}</h4>
              <span>Video</span>
            </div>
          `;

          item.addEventListener("click", () => {
            document.querySelectorAll(".video-item").forEach(el => el.classList.remove("active"));
            item.classList.add("active");

            currentTitle.textContent = video.title;
            videoFrame.src = getEmbedUrl(video.url);
          });

          videoList.appendChild(item);
        });
      }

      function initFirstVideo() {
        const first = videos[0];
        currentTitle.textContent = first.title;
        videoFrame.src = getEmbedUrl(first.url);
      }

      renderPlaylist();
      initFirstVideo();
    </script>
  </body>
</html>
