<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METRAJES_404</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">

    <style>
      :root{
        --bg: #050b12;
        --panel: #0b1118;
        --panel-2: rgba(18, 24, 30, 0.9);
        --border: rgba(255,255,255,0.18);
        --text: #f3f3f3;
        --muted: #d0d0d0;
        --blue: #5a9cf7;
        --blue-2: #3d86ff;
        --shadow: rgba(0,0,0,0.86);
        --search-bg: rgba(255,255,255,0.02);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Special Elite", monospace;
      }

      body {
        background:
          linear-gradient(to bottom, rgba(255,255,255,0.02), transparent 10%),
          #050b12;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        background: #060d13;
      }

      .topbar {
        height: 96px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 18px 0 22px;
        gap: 20px;
      }

      .logo {
        flex: 0 0 auto;
        font-family: "Creepster", cursive;
        font-size: clamp(2.5rem, 4vw, 5rem);
        letter-spacing: 0.08em;
        line-height: 1;
        color: #f6f7f8;
        text-shadow:
          2px 2px 0 #000,
          4px 4px 0 rgba(255,255,255,0.22),
          0 0 18px rgba(255,255,255,0.12);
        transform: scaleY(1.02);
        white-space: nowrap;
      }

      .logo .num {
        font-family: "Creepster", cursive;
        display: inline-block;
        transform: skewX(-7deg);
      }

      .search-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 20px;
      }

      .searchbar {
        flex: 1;
        max-width: 980px;
        height: 56px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.02);
        border-radius: 6px;
        display: flex;
        align-items: center;
        padding: 0 18px;
        margin-left: 8px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      }

      .searchbar input {
        background: transparent;
        border: none;
        outline: none;
        flex: 1;
        font-family: "Special Elite", monospace;
        font-size: 2rem;
        color: rgba(255,255,255,0.82);
      }

      .searchbar input::placeholder {
        color: rgba(255,255,255,0.46);
      }

      .search-btn {
        width: 124px;
        height: 56px;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 6px;
        background: rgba(255,255,255,0.04);
        color: #f1f1f1;
        font-size: 1.08rem;
        font-family: "Special Elite", monospace;
        cursor: pointer;
        margin-left: 14px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        transition: 0.15s ease;
      }

      .search-btn:hover {
        background: rgba(255,255,255,0.08);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-left: auto;
        padding-right: 8px;
      }

      .nav a {
        font-family: "Special Elite", monospace;
        font-size: 1.05rem;
        color: #4d98ff;
        text-decoration: none;
        letter-spacing: 0.02em;
        text-shadow: 0 0 4px rgba(105,160,255,0.22);
      }

      .nav .upload {
        margin-left: 8px;
      }

      .content {
        padding: 24px 16px 26px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .video-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px 28px;
        width: min(100%, 1780px);
        margin: 0 auto;
      }

      .card {
        display: grid;
        grid-template-columns: 350px 1fr;
        min-height: 190px;
        background: rgba(17, 21, 26, 0.72);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      }

      .thumb {
        position: relative;
        min-height: 100%;
        background-size: cover;
        background-position: center;
        border-right: 1px solid rgba(255,255,255,0.08);
      }

      .thumb::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(0,0,0,0.12), rgba(0,0,0,0.0));
      }

      .meta {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 18px 18px 18px 18px;
        min-width: 0;
      }

      .title-pill {
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        background: var(--blue);
        color: #f2f8ff;
        padding: 10px 18px 9px;
        border-radius: 8px;
        font-size: clamp(1.15rem, 1.7vw, 2.1rem);
        line-height: 1.1;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        text-shadow: 0 0 10px rgba(255,255,255,0.06);
      }

      .source {
        margin-top: 18px;
        color: #f0f0f0;
        font-size: clamp(1.1rem, 1.6vw, 1.6rem);
        line-height: 1.5;
      }

      .source .label {
        display: block;
        color: rgba(255,255,255,0.9);
      }

      .source .encounter {
        display: block;
        color: rgba(255,255,255,0.82);
      }

      .source strong {
        font-weight: normal;
      }

      .muted {
        color: rgba(255,255,255,0.9);
      }

      @media (max-width: 1100px) {
        .video-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          flex-wrap: wrap;
          height: auto;
          padding-top: 12px;
          padding-bottom: 12px;
        }

        .logo {
          width: 100%;
        }

        .search-wrap {
          width: 100%;
          margin-top: 8px;
        }

        .nav {
          width: 100%;
          justify-content: flex-end;
          margin-left: 0;
        }

        .card {
          grid-template-columns: 220px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo"><span class="num">METRAJES_404</span></div>

        <div class="search-wrap">
          <div class="searchbar">
            <input type="text" placeholder="Search" aria-label="Search" />
          </div>
          <button class="search-btn">Search</button>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <a href="#" class="upload">Upload</a>
          <a href="#">Sign in</a>
        </nav>
      </header>

      <main class="content">
        <section class="video-grid">
          <article class="card">
            <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80');"></div>
            <div class="meta">
              <div class="title-pill">La Caída de Edgar</div>
              <div class="source">
                <span class="label">YouTube</span>
                <span class="encounter">Encontrado por: <strong>DonNadie404</strong></span>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80');"></div>
            <div class="meta">
              <div class="title-pill">muñeca mueve cabeza</div>
              <div class="source">
                <span class="label">YouTube</span>
                <span class="encounter">Encontrado por: <strong>DonNadie404</strong></span>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=1200&q=80');"></div>
            <div class="meta">
              <div class="title-pill">Username:666</div>
              <div class="source">
                <span class="label">YouTube</span>
                <span class="encounter">Encontrado por: <strong>DonNadie404</strong></span>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=1200&q=80');"></div>
            <div class="meta">
              <div class="title-pill">1980s PSA - "We're Not Candy!"</div>
              <div class="source">
                <span class="label">YouTube</span>
                <span class="encounter">Encontrado por: <strong>DonNadie404</strong></span>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
