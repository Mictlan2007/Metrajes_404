<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METRAJES_404</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=VT323&display=swap" rel="stylesheet" />

    <style>
      :root{
        --bg: #04070b;
        --panel: #0b1016;
        --panel-2: rgba(18, 22, 28, 0.9);
        --border: rgba(255,255,255,0.14);
        --text: #f2f2f2;
        --muted: #d1d1d1;
        --blue: #4a90ff;
        --blue-strong: #336fec;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Special Elite", monospace;
      }

      body {
        background:
          linear-gradient(to bottom, rgba(255,255,255,0.02), transparent 12%),
          #04070b;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        background: #050b12;
      }

      .topbar {
        height: 86px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 14px 0 14px;
        gap: 16px;
        background: rgba(0,0,0,0.12);
      }

      .logo {
        flex: 0 0 auto;
        font-family: "Creepster", cursive;
        font-size: clamp(3rem, 4.2vw, 6rem);
        line-height: 1;
        letter-spacing: 0.03em;
        color: #f4f4f4;
        text-shadow:
          2px 2px 0 rgba(0,0,0,0.8),
          4px 4px 0 rgba(255,255,255,0.12),
          0 0 14px rgba(255,255,255,0.06);
        transform: skewX(-4deg);
        white-space: nowrap;
      }

      .search-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-width: 0;
        gap: 10px;
      }

      .searchbar {
        flex: 1;
        max-width: 920px;
        height: 56px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        margin-left: 10px;
      }

      .searchbar input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: rgba(255,255,255,0.8);
        font-family: "Special Elite", monospace;
        font-size: 1.5rem;
      }

      .searchbar input::placeholder {
        color: rgba(255,255,255,0.48);
      }

      .search-btn {
        width: 122px;
        height: 56px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        background: rgba(255,255,255,0.04);
        color: #f1f1f1;
        font-family: "Special Elite", monospace;
        font-size: 1.1rem;
        cursor: pointer;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: auto;
        padding-right: 8px;
        white-space: nowrap;
      }

      .nav a {
        font-family: "Special Elite", monospace;
        font-size: 1.05rem;
        color: var(--blue);
        text-decoration: none;
        letter-spacing: 0.02em;
      }

      .content {
        padding: 20px 12px 24px;
      }

      .video-grid {
        width: min(100%, 1760px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px 28px;
      }

      .card {
        display: grid;
        grid-template-columns: 300px 1fr;
        min-height: 180px;
        background: rgba(14, 19, 24, 0.86);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        cursor: pointer;
      }

      .thumb {
        position: relative;
        min-height: 100%;
        background-size: cover;
        background-position: center;
        border-right: 1px solid rgba(255,255,255,0.08);
      }

      .thumb::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0));
      }

      .meta {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 14px 18px 16px;
      }

      .title-pill {
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        background: var(--blue);
        color: #ecf6ff;
        border-radius: 8px;
        padding: 10px 18px 8px;
        font-size: clamp(1.2rem, 1.7vw, 2.3rem);
        line-height: 1.1;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .source {
        margin-top: 18px;
        font-size: clamp(1.3rem, 1.8vw, 2.2rem);
        line-height: 1.3;
        color: rgba(255,255,255,0.92);
      }

      .source .label {
        display: block;
        color: rgba(255,255,255,0.9);
      }

      .source .encounter {
        display: block;
        color: rgba(255,255,255,0.82);
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 10, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }

      .modal.open {
        display: flex;
      }

      .modal-box {
        width: min(74vw, 900px);
        background: #0b1118;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 10px;
        overflow: hidden;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .modal-title {
        font-size: 1.1rem;
        color: #f2f2f2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .close-btn {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        background: transparent;
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
      }

      .video-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .video-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 1150px) {
        .video-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          flex-wrap: wrap;
          height: auto;
          padding-top: 10px;
          padding-bottom: 10px;
        }

        .logo {
          width: 100%;
        }

        .search-wrap {
          width: 100%;
        }

        .nav {
          width: 100%;
          justify-content: flex-end;
        }

        .card {
          grid-template-columns: 220px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="logo">METRAJES_404</div>

        <div class="search-wrap">
          <div class="searchbar">
            <input type="text" id="searchInput" placeholder="Search" />
          </div>
          <button class="search-btn">Search</button>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <a href="#">Upload</a>
          <a href="#">Sign in</a>
        </nav>
      </header>

      <main class="content">
        <section id="videoGrid" class="video-grid"></section>
      </main>
    </div>

    <div id="videoModal" class="modal" aria-hidden="true">
      <div class="modal-box">
        <div class="modal-header">
          <div id="modalTitle" class="modal-title">Video</div>
          <button id="closeModal" class="close-btn" aria-label="Close video">×</button>
        </div>
        <div class="video-frame">
          <iframe id="playerFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="Embedded video"></iframe>
        </div>
      </div>
    </div>

    <script>
      const videos = [
        { title: "La Caída de Edgar", url: "https://youtu.be/7xM7Q7uYzTQ" },
        { title: "muñeca mueve cabeza", url: "https://youtu.be/42GgI8KZQ6M" },
        { title: "Username:666", url: "https://youtu.be/5Q0AFef3QT0" },
        { title: "1980s PSA - \"We're Not Candy!\"", url: "https://youtu.be/0o7nZ95EwMQ" },

        { title: "Tengo Miedo!", url: "https://youtu.be/p7zevPed3Ss?si=FB4jr-6bAI_FypnM" },
        { title: "Keyboard Cat! - EL ORIGINAL!", url: "https://youtu.be/J---aiyznGQ?si=7wKKtr93bBLFnoHg" },
        { title: "Mirada Dramática", url: "https://youtu.be/y8Kyi0WNg40?si=16-cXDdtcttkvp7f" },
        { title: "Aparición de un Duende", url: "https://youtu.be/xPghfRHZUFs?si=Lh0jyra4t4DHI80n" },
        { title: "Body Of A Pig", url: "https://youtu.be/X72xDpv898Y?si=URfompjMCPqXnNYF" },
        { title: "“Dining Room” o “There is Nothing”", url: "https://youtu.be/ns1SGo3WCF4?si=gpxBpzMSae3ORL7O" },
        { title: "Experimentos sobre la Reanimación de Organismos", url: "https://youtu.be/KDqh-r8TQgs?si=yjgnS6cUqokESQQQ" },
        { title: "Hombre se pierde en las Catacumbas de París Parte 1 de 2", url: "https://youtu.be/yxJkMlqYrys?si=fiHjDgGhfFq4tdDF" },
        { title: "Max Headroom 1987 Incidente de Intrusión en la Señal de Transmisión", url: "https://youtu.be/oqgeM6rWSkw?si=RyZWanv83laKocdu" },
        { title: "Hombre se pierde en las Catacumbas de París Parte 2 de 2", url: "https://youtu.be/Hi5iKa3DFnM?si=Wf6AZzm9KwX_uPFg" },
        { title: "EXN OFICIAL: LA PASCUALITA DE CHIHUAHUA", url: "https://youtu.be/cUG6MSkIfFY?si=Elgz-DybWD6LPanA" }
      ];

      const videoGrid = document.getElementById("videoGrid");
      const searchInput = document.getElementById("searchInput");
      const videoModal = document.getElementById("videoModal");
      const modalTitle = document.getElementById("modalTitle");
      const playerFrame = document.getElementById("playerFrame");
      const closeModal = document.getElementById("closeModal");

      function getVideoIdFromUrl(url) {
        try {
          const parsed = new URL(url);

          if (parsed.hostname.includes("youtu.be")) {
            return parsed.pathname.replace("/", "");
          }

          if (parsed.hostname.includes("youtube.com")) {
            const v = parsed.searchParams.get("v");
            if (v) return v;
          }

          return "";
        } catch (err) {
          return "";
        }
      }

      function getEmbedUrl(url) {
        const id = getVideoIdFromUrl(url);
        return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
      }

      function openModal(video) {
        modalTitle.textContent = video.title;
        playerFrame.src = getEmbedUrl(video.url);
        videoModal.classList.add("open");
      }

      function closeVideoModal() {
        videoModal.classList.remove("open");
        playerFrame.src = "";
      }

      function renderVideos(filter = "") {
        const query = filter.trim().toLowerCase();
        videoGrid.innerHTML = "";

        const filtered = videos.filter((video) =>
          video.title.toLowerCase().includes(query)
        );

        filtered.forEach((video) => {
          const card = document.createElement("article");
          card.className = "card";
          const videoId = getVideoIdFromUrl(video.url);

          card.innerHTML = `
            <div class="thumb" style="background-image: url('https://img.youtube.com/vi/${videoId}/hqdefault.jpg');"></div>
            <div class="meta">
              <div class="title-pill">${video.title}</div>
              <div class="source">
                <span class="label">YouTube</span>
                <span class="encounter">Encontrado por: <strong>DonNadie404</strong></span>
              </div>
            </div>
          `;

          card.addEventListener("click", () => openModal(video));
          videoGrid.appendChild(card);
        });
      }

      searchInput.addEventListener("input", (e) => {
        renderVideos(e.target.value);
      });

      closeModal.addEventListener("click", closeVideoModal);

      videoModal.addEventListener("click", (e) => {
        if (e.target === videoModal) closeVideoModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && videoModal.classList.contains("open")) {
          closeVideoModal();
        }
      });

      renderVideos();
    </script>
  </body>
</html>
